<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Attendance App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>College Smart Attendance App</h1>

    <!-- Add Student Section -->
    <section id="add-student">
      <h2>Add Student</h2>
      <input type="text" id="student-name" placeholder="Enter student name">
      <input type="text" id="student-id" placeholder="Enter student ID">
      <button id="add-student-btn">Add Student</button>
    </section>

    <hr>

    <!-- Mark Attendance Section -->
    <section id="mark-attendance">
      <h2>Mark Attendance</h2>
      <ul id="student-list"></ul>
    </section>

    <hr>

    <!-- Attendance Report Section -->
    <section id="attendance-report">
      <h2>Attendance Report</h2>
      <ul id="attendance-report-list"></ul>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
